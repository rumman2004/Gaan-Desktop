name: Build & Release Windows Installer (.exe)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the builds to (e.g. v1.1.2). Empty = current branch/ref'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.ref_name) || github.ref_name }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + Electron main
        run: npm run build
        env:
          GAAN_SUPABASE_URL: ${{ secrets.GAAN_SUPABASE_URL }}
          GAAN_SUPABASE_KEY: ${{ secrets.GAAN_SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.xingchiapi.com/v1' }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-6.1-sol' }}
          GAAN_RELEASE: "1"

      - name: Package Windows Installer (.exe) and Publish
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAAN_RELEASE: "1"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gaan-Windows-Setup
          path: |
            release/*.exe
            release/latest.yml
