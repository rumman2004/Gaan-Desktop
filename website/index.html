<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('gaan_theme_preference');
          const theme = preference === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#090909' : '#ffffff');
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/gaan-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Gaan — Your music. Your way. Without limits.</title>
    <meta name="description" content="A free, open-source music player for YouTube Music, your own library, synced lyrics, and listening on desktop or Android." />
    <meta name="keywords" content="music player, spotify alternative, youtube music desktop, open source music player, synced lyrics, ai music shuffle, electron music, gaan desktop" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gaan — All your music, one space" />
    <meta property="og:description" content="YouTube Music, your own collection, and the details that make listening yours." />
    <meta property="og:image" content="/brand/SEO.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gaan — All your music, one space" />
    <meta name="twitter:description" content="YouTube Music, your own collection, and the details that make listening yours." />
    <meta name="twitter:image" content="/brand/SEO.jpg" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
